# whatever a member symlinks to, keep the private bits out of reach
[Service]
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes
NoNewPrivileges=yes
InaccessiblePaths=/root /boot /opt /srv /var/lib /var/log /var/backups /etc/runv /etc/runv-join /etc/letsencrypt /etc/ssh /etc/molly-brown /etc/nginx
