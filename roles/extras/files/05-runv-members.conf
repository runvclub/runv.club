# read before 10-runv-admin.conf on purpose: sshd keeps the first value
# it finds, so these win for the people they match.

# one keys file, the one runv-user writes. authorized_keys2 is a leftover
AuthorizedKeysFile .ssh/authorized_keys

# members can forward a port of their own machine to their tunnel socket
# in /run/runv-apps, and nothing else: no -L, -D or -R to tcp ports.
# that keeps the box from becoming anyone's proxy. sshd only allows -R to
# a socket when tcp remote forwarding is on, so that stays on with no
# port it may listen on
Match Group members
    AllowTcpForwarding remote
    PermitListen none
    AllowStreamLocalForwarding remote
    StreamLocalBindUnlink yes
    StreamLocalBindMask 0117
    PermitTunnel no

# ssh join@runv.club: no password, straight into the signup questions
Match User join
    PasswordAuthentication yes
    PermitEmptyPasswords yes
    PubkeyAuthentication no
    DisableForwarding yes
    PermitTTY yes
    MaxSessions 1
    ForceCommand /usr/local/bin/runv-join-ssh
