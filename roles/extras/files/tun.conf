# NAME.tun.runv.club goes to /run/runv-apps/NAME/app.sock: a tunnel from the
# member's own machine (ssh -R) or an app they run here
server {
    listen 80;
    listen [::]:80;
    server_name tun.runv.club *.tun.runv.club;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name "~^(?<tun>[a-z][a-z0-9_]{1,15})\.tun\.runv\.club$" tun.runv.club;

    ssl_certificate     /etc/letsencrypt/live/tun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tun/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;
    error_page 502 504 /.runv-no-tunnel;

    location = /.runv-no-tunnel {
        internal;
        default_type text/plain;
        return 502 "nothing is listening here right now.\nmembers: help apps\n";
    }

    location / {
        if ($tun = "") {
            return 302 https://runv.club/;
        }
        proxy_pass http://unix:/run/runv-apps/$tun/app.sock:;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-For $remote_addr;
        # an app can't set a cookie for runv.club and its other services
        proxy_cookie_domain ~.* $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
    }
}
