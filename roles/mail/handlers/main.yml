- name: postmap virtual
  ansible.builtin.shell: |
    postmap /etc/postfix/virtual
    chgrp postfix /etc/postfix/virtual.db
    chmod 640 /etc/postfix/virtual.db
  notify: reload postfix

- name: postmap transport
  ansible.builtin.shell: |
    postmap /etc/postfix/transport
    chgrp postfix /etc/postfix/transport.db
    chmod 640 /etc/postfix/transport.db
  notify: reload postfix

- name: postalias lists
  ansible.builtin.command: postalias /etc/postfix/runv-lists
  notify: reload postfix

- name: reload postfix
  ansible.builtin.shell: postfix check && systemctl reload-or-restart postfix

- name: restart postsrsd
  ansible.builtin.systemd_service:
    name: postsrsd
    state: restarted

- name: restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
