- name: postfix without the debconf setup
  ansible.builtin.debconf:
    name: postfix
    question: postfix/main_mailer_type
    value: No configuration
    vtype: select

- name: postfix and srs
  ansible.builtin.apt:
    name:
      - postfix
      - postsrsd
    state: present
    install_recommends: false

- name: postsrsd settings
  ansible.builtin.copy:
    src: postsrsd
    dest: /etc/default/postsrsd
    owner: root
    group: root
    mode: "0644"
  notify: restart postsrsd

- name: main.cf
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
  notify: reload postfix

- name: master.cf
  ansible.builtin.copy:
    src: master.cf
    dest: /etc/postfix/master.cf
    owner: root
    group: root
    mode: "0644"
  notify: reload postfix

# runv-user fills these in as members come and go. they only need to exist
- name: member lists postfix reads
  ansible.builtin.copy:
    content: ""
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
    force: false
  loop:
    - /etc/postfix/runv-submitters
    - /etc/postfix/runv-local.regexp

- name: old name of the local delivery map
  ansible.builtin.file:
    path: /etc/postfix/runv-suspended.regexp
    state: absent

- name: list members dir
  ansible.builtin.file:
    path: /var/lib/runv-lists
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: who members may send as
  ansible.builtin.copy:
    src: login-senders.regexp
    dest: /etc/postfix/login-senders.regexp
    owner: root
    group: root
    mode: "0644"
  notify: reload postfix

- name: who outside may write to
  ansible.builtin.template:
    src: inbound-recipients.regexp.j2
    dest: /etc/postfix/inbound-recipients.regexp
    owner: root
    group: root
    mode: "0644"
  notify: reload postfix

# it holds the admin's own address, like the forwards
- name: transport
  ansible.builtin.template:
    src: transport.j2
    dest: /etc/postfix/transport
    owner: root
    group: postfix
    mode: "0640"
  notify: postmap transport

- name: transport map exists
  ansible.builtin.shell: |
    postmap /etc/postfix/transport
    chgrp postfix /etc/postfix/transport.db
    chmod 640 /etc/postfix/transport.db
  args:
    creates: /etc/postfix/transport.db

- name: lists
  ansible.builtin.template:
    src: runv-lists.j2
    dest: /etc/postfix/runv-lists
    owner: root
    group: root
    mode: "0644"
  notify: postalias lists

- name: lists map exists
  ansible.builtin.command: postalias /etc/postfix/runv-lists
  args:
    creates: /etc/postfix/runv-lists.db

- name: forwards
  ansible.builtin.template:
    src: virtual.j2
    dest: /etc/postfix/virtual
    owner: root
    group: postfix
    mode: "0640"
  notify: postmap virtual

- name: virtual map exists
  ansible.builtin.command: postmap /etc/postfix/virtual
  args:
    creates: /etc/postfix/virtual.db

# it holds the admin's own address
- name: forwards map is private
  ansible.builtin.file:
    path: /etc/postfix/virtual.db
    owner: root
    group: postfix
    mode: "0640"

- name: reload postfix after renewals
  ansible.builtin.copy:
    src: reload-postfix
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-postfix
    owner: root
    group: root
    mode: "0755"

- name: services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - postsrsd
    - postfix

- name: fail2ban jail
  ansible.builtin.copy:
    src: jail-postfix.conf
    dest: /etc/fail2ban/jail.d/postfix.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: firewall for smtp
  ansible.builtin.command: ufw allow 25/tcp
  register: ufw_rule
  changed_when: "'Rule added' in ufw_rule.stdout"

- name: mail clients for members
  ansible.builtin.apt:
    name:
      - s-nail
      - mutt
      - alpine
    state: present
    install_recommends: false

# who may send, who's suspended and who is on which list
- name: member mail settings
  ansible.builtin.command: /usr/local/sbin/runv-user mail-sync
  register: mail_sync
  changed_when: "'changed' in mail_sync.stdout"
