# what a member needs to learn their way around a shell
- name: member tools
  ansible.builtin.apt:
    name:
      - nano
      - vim
      - git
      - python3
      - gcc
      - make
      - libc6-dev
      - man-db
      - manpages
      - less
      - tmux
      - htop
      - curl
      - wget
      - rsync
      - tree
      - jq
      - zip
      - unzip
      - file
      - bc
      - weechat-curses
      - irssi
      - python3-markdown
    state: present
    install_recommends: false

- name: chat command
  ansible.builtin.copy:
    src: chat
    dest: /usr/local/bin/chat
    owner: root
    group: root
    mode: "0755"

- name: help command
  ansible.builtin.copy:
    src: runv-help
    dest: /usr/local/bin/runv-help
    owner: root
    group: root
    mode: "0755"

- name: dashboard
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/local/bin/{{ item }}
    owner: root
    group: root
    mode: "0755"
  loop:
    - runv
    - blog
    - pb
    - tw
    - board

# pb used to be installed as paste, which hid coreutils' paste
- name: old paste command
  ansible.builtin.file:
    path: /usr/local/bin/paste
    state: absent

- name: help topics
  ansible.builtin.copy:
    src: help/
    dest: /usr/local/share/runv/help/
    owner: root
    group: root
    mode: u=rwX,go=rX
    directory_mode: "0755"

- name: help alias
  ansible.builtin.copy:
    src: profile-runv.sh
    dest: /etc/profile.d/runv.sh
    owner: root
    group: root
    mode: "0644"

# the banner is drawn at login by /usr/local/bin/motd, so the static one stays empty
- name: motd
  ansible.builtin.copy:
    src: motd
    dest: /usr/local/bin/motd
    owner: root
    group: root
    mode: "0755"

- name: no static motd
  ansible.builtin.copy:
    content: ""
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"

- name: motd at login
  ansible.builtin.copy:
    src: profile-motd.sh
    dest: /etc/profile.d/runv-motd.sh
    owner: root
    group: root
    mode: "0644"

# the admin writes here by hand, ansible only makes the first one
- name: news for the motd
  ansible.builtin.copy:
    content: |
      # one item per line, newest last: YYYY-MM-DD what happened
      # the motd shows the last one for 30 days
    dest: /etc/runv-news
    owner: root
    group: root
    mode: "0644"
    force: false
