# eepsites. each member's tunnel sends its own name as the Host header.
# everything here arrives from 127.0.0.1, so nothing is allowed by address
server {
    listen 127.0.0.1:7980 default_server;
    return 404;
}

server {
    listen 127.0.0.1:7980;
    server_name "~^(?<member>[a-z][a-z0-9_]{1,15})$";

    root /home/$member/public_i2p;
    index index.html;
    autoindex off;
    disable_symlinks if_not_owner;
    access_log off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    error_page 403 =404 /404;
    location = /404 {
        internal;
        return 404 "not found\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
