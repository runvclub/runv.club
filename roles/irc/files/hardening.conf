[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ReadWritePaths=/var/lib/soju
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
LockPersonality=yes
CapabilityBoundingSet=
MemoryMax=512M
# members can make these fetch urls (webhooks, feeds, bookmarks), and the
# firewall rules for members don't cover service users: no tailnet, no
# cloud metadata
IPAddressDeny=100.64.0.0/10 169.254.0.0/16 fd7a:115c:a1e0::/48
