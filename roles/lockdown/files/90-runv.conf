# a shared box: members don't get to poke at each other or at the kernel
kernel.kptr_restrict = 1
kernel.yama.ptrace_scope = 1
kernel.unprivileged_userns_clone = 0
# /tmp, /var/tmp and /srv/square are shared: no tricks with links or fifos
# planted there for someone else to open
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_regular = 2
fs.protected_fifos = 2
