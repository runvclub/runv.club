
# only POSTs to /join count against the limit
map $request_method $join_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $join_limit_key zone=join:10m rate=5r/m;

# guestbooks: few notes, a fair amount of reading
map $request_method $gb_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $gb_post_key zone=gb_post:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=gb_read:10m rate=5r/s;
limit_req_status 429;

# ~member pages get their own log, read hourly by runv-stats
log_format runv_members '$member\t$time_iso8601\t$remote_addr\t$status\t$request_method\t$uri\t$http_referer\t$http_user_agent';
