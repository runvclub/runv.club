# caddy served the farewell letter before this role existed
- name: is nginx installed
  ansible.builtin.stat:
    path: /usr/sbin/nginx
  register: nginx_bin

- name: stop caddy so nginx can take 80 and 443
  ansible.builtin.systemd_service:
    name: caddy
    state: stopped
  when: not nginx_bin.stat.exists
  failed_when: false

- name: nginx and certbot
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
    state: present
    install_recommends: false

- name: site and acme dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /var/www/runv
    - /var/www/acme

- name: site files
  ansible.builtin.copy:
    src: site/
    dest: /var/www/runv/
    owner: root
    group: root
    mode: u=rwX,go=rX

# /about only goes up once the costs are in. the home page pulls the link
# in with ssi, so it shows up and goes away with the page
- name: about page
  ansible.builtin.template:
    src: about.html.j2
    dest: /var/www/runv/about.html
    owner: root
    group: root
    mode: "0644"
  when: about_costs | length > 0

- name: no about page without the costs
  ansible.builtin.file:
    path: /var/www/runv/about.html
    state: absent
  when: about_costs | length == 0

- name: about link for the home page
  ansible.builtin.copy:
    content: "{{ ' · <a href=\"/about\">about</a>' if about_costs | length > 0 else '' }}"
    dest: /var/www/runv/about-link.html
    owner: root
    group: root
    mode: "0644"

- name: help on the web
  ansible.builtin.copy:
    src: runv-help-web
    dest: /usr/local/sbin/runv-help-web
    owner: root
    group: root
    mode: "0755"

# the topics come from the tools role, which runs before this one
- name: help pages
  ansible.builtin.command: /usr/local/sbin/runv-help-web
  register: help_web
  changed_when: "'changed' in help_web.stdout"

- name: home page used to live in home.html
  ansible.builtin.file:
    path: /var/www/runv/home.html
    state: absent

- name: nginx snippets
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: runv-common.conf, dest: /etc/nginx/conf.d/runv-common.conf }
    - { src: runv-headers.conf, dest: /etc/nginx/snippets/runv-headers.conf }
  notify: reload nginx

- name: no default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

# names we don't serve get nothing, instead of whichever vhost comes first
- name: catch-all for unknown names
  ansible.builtin.copy:
    src: 00-unknown.conf
    dest: /etc/nginx/sites-enabled/00-unknown.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: certificate already there
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/runv.club/fullchain.pem
  register: cert

- name: http vhost
  ansible.builtin.template:
    src: runv.club-http.conf.j2
    dest: /etc/nginx/sites-enabled/runv.club-http.conf
    owner: root
    group: root
    mode: "0644"
  vars:
    have_cert: "{{ cert.stat.exists }}"
  notify: reload nginx

- name: nginx running
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

- name: apply nginx changes before asking for a cert
  ansible.builtin.meta: flush_handlers

- name: names on the current certificate
  ansible.builtin.shell: >
    openssl x509 -in /etc/letsencrypt/live/runv.club/fullchain.pem -noout -ext subjectAltName
    | grep -o 'DNS:[^,]*' | cut -d: -f2 | sort
  register: cert_names
  changed_when: false
  failed_when: false

- name: get or expand the certificate
  ansible.builtin.command: >
    certbot certonly --webroot -w /var/www/acme
    {% for n in web_cert_names %}-d {{ n }} {% endfor %}
    --cert-name runv.club --expand --agree-tos --register-unsafely-without-email
    --non-interactive
  when: (web_cert_names | sort) != (cert_names.stdout_lines | default([]))

- name: reload nginx after renewals
  ansible.builtin.copy:
    src: reload-nginx
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx
    owner: root
    group: root
    mode: "0755"

- name: http vhost now redirects
  ansible.builtin.template:
    src: runv.club-http.conf.j2
    dest: /etc/nginx/sites-enabled/runv.club-http.conf
    owner: root
    group: root
    mode: "0644"
  vars:
    have_cert: true
  notify: reload nginx

- name: https vhost
  ansible.builtin.template:
    src: runv.club.conf.j2
    dest: /etc/nginx/sites-enabled/runv.club.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload nginx

- name: certbot renewal timer
  ansible.builtin.systemd_service:
    name: certbot.timer
    enabled: true
    state: started

- name: caddy is gone
  ansible.builtin.apt:
    name: caddy
    state: absent
    purge: true

- name: caddy leftovers
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/caddy
    - /var/lib/caddy
