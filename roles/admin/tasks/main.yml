- name: backup secrets are in place
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/runv/s3.env
    - /etc/runv/restic.pass
  register: secrets

- name: stop if a secret is missing
  ansible.builtin.fail:
    msg: "{{ item.item }} is missing, see README"
  loop: "{{ secrets.results }}"
  when: not item.stat.exists

- name: restic cache dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /var/cache/restic

- name: lib dir
  ansible.builtin.file:
    path: /usr/local/lib/runv
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: shared python helpers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/local/lib/runv/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - runvmail.py
    - runvcheck.py
    - runvsecret.py
    - runvirc.py

- name: admin commands
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/local/sbin/{{ item }}
    owner: root
    group: root
    mode: "0755"
  loop:
    - runv-user
    - runv-queue
    - runv-backup
    - runv-alert
    - runv-weekly
    - runv-priv
    - runv-stats
    - runv-planet
    - runv-members-tick

# members reach runv-priv through sudo, and nothing else. it works out who
# called it from SUDO_USER and takes fixed subcommands only
- name: members can run runv-priv
  ansible.builtin.copy:
    content: |
      %members ALL=(root) NOPASSWD: /usr/local/sbin/runv-priv
    dest: /etc/sudoers.d/60-runv-members
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: backup path lists
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/runv/{{ item }}
    owner: root
    group: root
    mode: "0600"
  loop:
    - backup-exclude
    - backup-instant.paths

- name: mail settings example
  ansible.builtin.copy:
    src: mail.env.example
    dest: /etc/runv/mail.env.example
    owner: root
    group: root
    mode: "0600"

- name: systemd units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - runv-alert@.service
    - runv-backup.service
    - runv-backup.timer
    - runv-backup-instant.service
    - runv-backup-instant.path
    - runv-purge.service
    - runv-purge.timer
    - runv-weekly.service
    - runv-weekly.timer
    - runv-queue-notify.path
    - runv-queue-notify.service
    - runv-queue-notify.timer
    - runv-queue-tick.service
    - runv-queue-tick.timer
    - runv-gemini-sync.service
    - runv-i2p-sync.service
    - runv-stats.service
    - runv-stats.timer
    - runv-planet.service
    - runv-planet.timer
    - runv-members-tick.service
    - runv-members-tick.timer
  notify: daemon reload

- name: reload units now
  ansible.builtin.meta: flush_handlers

- name: timers and watchers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - runv-backup.timer
    - runv-backup-instant.path
    - runv-purge.timer
    - runv-weekly.timer
    - runv-queue-notify.path
    - runv-queue-notify.timer
    - runv-queue-tick.timer
    - runv-stats.timer
    - runv-planet.timer
    - runv-members-tick.timer

- name: gemini mounts at boot
  ansible.builtin.systemd_service:
    name: runv-gemini-sync.service
    enabled: true

- name: old queue location
  ansible.builtin.file:
    path: /var/lib/runv/queue
    state: absent
